        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #450a0a, #020617);
            min-height: 100vh;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(20, 3, 3, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .gradient-border {
            position: relative;
            border-radius: 1rem;
        }

        .gradient-border::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #ef4444, #f59e0b, #991b1b);
            border-radius: 1.1rem;
            z-index: -1;
            opacity: 0.3;
        }

        .btn-red {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #991b1b, #ef4444);
        }

        .btn-red:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            filter: brightness(1.1);
        }

        .btn-red:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #991b1b; border-radius: 10px; }
    </style>

        const API_URL = "https://script.google.com/macros/s/AKfycbwL6Rsmvpn6g3YxXuGfga_OrA7TEd5p_bwxeIrEJOxaslSYtsqrKSfm_NvkOST7HZzFUg/exec";

        window.unlockDrive = async () => {

            const pass = document.getElementById('passwordInput')
                .value
                .trim();

            if (!pass) {
                showStatus("Masukkan kode akses!", "error");
                return;
            }

            try {

                const response = await fetch(
                    `${API_URL}?action=get&kode=${pass}`
                );

                const result = await response.json();

                // if (result.status == "success") {

                //     document.getElementById('driveName').innerText = result.nama;

                //     document.getElementById('driveLink').href = result.link;

                //     document.getElementById('resultBox')
                //         .classList.remove('hidden');

                //     showStatus("Akses berhasil!", "success");

                if (result.status == "success") {

                    const nama = result.nama;
                    const link = result.link;

                    if (
                        !nama ||
                        !link ||
                        nama === "#N/A" ||
                        link === "#N/A"
                    ) {

                        showStatus(
                            "Satker yang akan Anda asesmen belum mengirimkan link dokumen eviden AMPUH melalui form pengumpulan. Silakan hubungi Admin AMPUH.",
                            "error"
                        );

                        document.getElementById('resultBox')
                            .classList.add('hidden');

                        return;
                    }

                    document.getElementById('driveName').innerText = nama;

                    document.getElementById('driveLink').href = link;

                    document.getElementById('resultBox')
                        .classList.remove('hidden');

                    showStatus("Akses berhasil!", "success");
    

                } else {

                    showStatus("Kode tidak ditemukan!", "error");

                    document.getElementById('resultBox')
                        .classList.add('hidden');
                }

            } catch (err) {

                console.log(err);

                showStatus("Gagal mengambil data!", "error");
            }
        };


        window.saveData = async () => {

            const kode = document.getElementById('newId')
                .value.trim();

            const nama = document.getElementById('newName')
                .value.trim();

            const link = document.getElementById('newLink')
                .value.trim();

            if (!kode || !nama || !link) {

                showStatus("Semua field wajib diisi!", "error");
                return;
            }

            try {

                const response = await fetch(
                    `${API_URL}?action=save&kode=${kode}&nama=${nama}&link=${link}`
                );

                const result = await response.json();

                if (result.status == "saved") {

                    showStatus("Data berhasil disimpan!", "success");

                    document.getElementById('newId').value = "";
                    document.getElementById('newName').value = "";
                    document.getElementById('newLink').value = "";

                } else {

                    showStatus("Gagal simpan data!", "error");
                }

            } catch (err) {

                console.log(err);

                showStatus("Koneksi gagal!", "error");
            }
        };

        window.toggleAdmin = () => {

            document.getElementById('adminPanel')
                .classList.toggle('hidden');
        };

        function showStatus(msg, type) {

            const status = document.getElementById('statusMessage');

            status.innerHTML = msg;

            status.className =
                `mt-4 p-3 rounded-lg text-sm text-center block ${
                    type === 'error'
                    ? 'bg-red-500/10 text-red-400'
                    : 'bg-green-500/10 text-green-400'
                }`;
        }
